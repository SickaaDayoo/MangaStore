<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Manga Store</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-900">

    <!-- Navbar -->
    <div id="navbar"></div>


    <!-- Checkout -->
    <main class="max-w-7xl mx-auto px-6 py-12">

        <!-- Header -->
        <div class="mb-8">

            <h1 class="text-3xl md:text-4xl font-bold">
                Checkout
            </h1>

            <p class="text-gray-500 mt-2">
                Complete your order details below.
            </p>

        </div>


        <form id="checkoutForm">

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">


                <!-- LEFT SIDE -->
                <div class="lg:col-span-2 space-y-6">


                    <!-- Customer Information -->
                    <div class="bg-white border border-gray-200 rounded-xl p-6">

                        <h2 class="text-xl font-bold mb-6">
                            Customer Information
                        </h2>


                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                            <!-- Full Name -->
                            <div class="md:col-span-2">

                                <label
                                    for="name"
                                    class="block text-sm font-semibold mb-2"
                                >
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your full name"
                                    required
                                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                                >

                            </div>


                            <!-- Email -->
                            <div>

                                <label
                                    for="email"
                                    class="block text-sm font-semibold mb-2"
                                >
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="example@email.com"
                                    required
                                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                                >

                            </div>


                            <!-- Phone -->
                            <div>

                                <label
                                    for="phone"
                                    class="block text-sm font-semibold mb-2"
                                >
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="09XXXXXXXXX"
                                    required
                                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                                >

                            </div>

                        </div>

                    </div>


                    <!-- Shipping Address -->
                    <div class="bg-white border border-gray-200 rounded-xl p-6">

                        <h2 class="text-xl font-bold mb-6">
                            Shipping Address
                        </h2>


                        <div class="space-y-5">


                            <!-- Address -->
                            <div>

                                <label
                                    for="address"
                                    class="block text-sm font-semibold mb-2"
                                >
                                    Complete Address
                                </label>

                                <textarea
                                    id="address"
                                    name="address"
                                    rows="3"
                                    placeholder="House/Unit No., Street, Barangay"
                                    required
                                    class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none resize-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                                ></textarea>

                            </div>


                            <!-- City + Postal -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                                <div>

                                    <label
                                        for="city"
                                        class="block text-sm font-semibold mb-2"
                                    >
                                        City / Municipality
                                    </label>

                                    <input
                                        type="text"
                                        id="city"
                                        name="city"
                                        placeholder="Enter city"
                                        required
                                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                                    >

                                </div>


                                <div>

                                    <label
                                        for="postal"
                                        class="block text-sm font-semibold mb-2"
                                    >
                                        Postal Code
                                    </label>

                                    <input
                                        type="text"
                                        id="postal"
                                        name="postal"
                                        placeholder="Postal code"
                                        required
                                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                                    >

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- Payment Method -->
                    <div class="bg-white border border-gray-200 rounded-xl p-6">

                        <h2 class="text-xl font-bold mb-6">
                            Payment Method
                        </h2>


                        <div class="space-y-3">


                            <!-- COD -->
                            <label class="flex items-center gap-4 border border-gray-200 rounded-lg p-4 cursor-pointer hover:bg-gray-50 transition">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="Cash on Delivery"
                                    required
                                    class="w-4 h-4"
                                >

                                <div>

                                    <p class="font-semibold">
                                        Cash on Delivery
                                    </p>

                                    <p class="text-sm text-gray-500">
                                        Pay when your order arrives.
                                    </p>

                                </div>

                            </label>


                            <!-- GCash -->
                            <label class="flex items-center gap-4 border border-gray-200 rounded-lg p-4 cursor-pointer hover:bg-gray-50 transition">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="GCash"
                                    class="w-4 h-4"
                                >

                                <div>

                                    <p class="font-semibold">
                                        GCash
                                    </p>

                                    <p class="text-sm text-gray-500">
                                        Pay using your GCash account.
                                    </p>

                                </div>

                            </label>


                            <!-- Card -->
                            <label class="flex items-center gap-4 border border-gray-200 rounded-lg p-4 cursor-pointer hover:bg-gray-50 transition">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="Credit/Debit Card"
                                    class="w-4 h-4"
                                >

                                <div>

                                    <p class="font-semibold">
                                        Credit / Debit Card
                                    </p>

                                    <p class="text-sm text-gray-500">
                                        Pay using your bank card.
                                    </p>

                                </div>

                            </label>

                        </div>

                    </div>

                </div>


                <!-- RIGHT SIDE -->
                <div>

                    <div class="bg-white border border-gray-200 rounded-xl p-6 sticky top-6">

                        <h2 class="text-xl font-bold mb-6">
                            Your Order
                        </h2>


                        <!-- Order Items -->
                        <div
                            id="orderItems"
                            class="space-y-4 mb-6"
                        ></div>


                        <!-- Divider -->
                        <div class="border-t pt-5 space-y-4">


                            <!-- Items -->
                            <div class="flex justify-between text-gray-600">

                                <span>
                                    Items
                                </span>

                                <span id="totalItems">
                                    0
                                </span>

                            </div>


                            <!-- Subtotal -->
                            <div class="flex justify-between text-gray-600">

                                <span>
                                    Subtotal
                                </span>

                                <span id="subtotal">
                                    ₱0.00
                                </span>

                            </div>


                            <!-- Shipping -->
                            <div class="flex justify-between text-gray-600">

                                <span>
                                    Shipping
                                </span>

                                <span class="text-green-600 font-semibold">
                                    Free
                                </span>

                            </div>


                            <!-- Total -->
                            <div class="border-t pt-4 flex justify-between items-center">

                                <span class="text-lg font-bold">
                                    Total
                                </span>

                                <span
                                    id="totalPrice"
                                    class="text-2xl font-bold"
                                >
                                    ₱0.00
                                </span>

                            </div>

                        </div>


                        <!-- Place Order -->
                        <button
                            type="submit"
                            class="w-full mt-6 bg-gray-900 text-white py-3 rounded-lg font-semibold hover:bg-gray-700 transition"
                        >
                            Place Order
                        </button>


                        <!-- Back to Cart -->
                        <a
                            href="cart.html"
                            class="block text-center mt-4 text-gray-500 hover:text-gray-900 transition"
                        >
                            ← Back to Cart
                        </a>

                    </div>

                </div>

            </div>

        </form>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>


    <script>

        // ===============================
        // GET CART
        // ===============================

        let cart = JSON.parse(localStorage.getItem("cart")) || [];


        // ===============================
        // DISPLAY ORDER
        // ===============================

        function displayOrder() {

            const orderItems = document.getElementById("orderItems");

            const totalItemsElement = document.getElementById("totalItems");

            const subtotalElement = document.getElementById("subtotal");

            const totalPriceElement = document.getElementById("totalPrice");


            // Empty cart
            if (cart.length === 0) {

                orderItems.innerHTML = `
                    <div class="text-center py-8">

                        <p class="text-gray-500 mb-4">
                            Your cart is empty.
                        </p>

                        <a
                            href="Products.html"
                            class="inline-block bg-gray-900 text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-700 transition"
                        >
                            Browse Manga
                        </a>

                    </div>
                `;

                totalItemsElement.textContent = "0";

                subtotalElement.textContent = "₱0.00";

                totalPriceElement.textContent = "₱0.00";

                return;
            }


            let subtotal = 0;

            let totalItems = 0;


            orderItems.innerHTML = cart.map(item => {

                const itemTotal = item.price * item.quantity;

                subtotal += itemTotal;

                totalItems += item.quantity;


                return `
                    <div class="flex justify-between gap-4">

                        <div class="min-w-0">

                            <p class="font-semibold text-sm leading-snug">
                                ${item.name}
                            </p>

                            <p class="text-xs text-gray-500 mt-1">
                                Qty: ${item.quantity}
                            </p>

                        </div>

                        <p class="font-semibold text-sm whitespace-nowrap">
                            ₱${itemTotal.toFixed(2)}
                        </p>

                    </div>
                `;

            }).join("");


            totalItemsElement.textContent = totalItems;

            subtotalElement.textContent = `₱${subtotal.toFixed(2)}`;

            totalPriceElement.textContent = `₱${subtotal.toFixed(2)}`;

        }


        // ===============================
        // PLACE ORDER
        // ===============================

        document
            .getElementById("checkoutForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                if (cart.length === 0) {

                    alert("Your cart is empty.");

                    return;

                }


                const formData = new FormData(this);

                const name = formData.get("name");

                const payment = formData.get("payment");


                alert(
                    `Order placed successfully!\n\n` +
                    `Thank you, ${name}!\n` +
                    `Payment Method: ${payment}`
                );


                // Clear cart
                localStorage.removeItem("cart");


                // Redirect
                window.location.href = "Products.html";

            });


        // ===============================
        // INITIAL LOAD
        // ===============================

        displayOrder();

    </script>

</body>
</html>
